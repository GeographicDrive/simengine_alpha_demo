name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Locate Android project directory
        id: locate
        run: |
          GRADLEW_PATH=$(find "$GITHUB_WORKSPACE" -maxdepth 6 -name "gradlew" -type f | head -n1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Could not find a 'gradlew' file anywhere in the repo."
            find "$GITHUB_WORKSPACE" -maxdepth 4
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x "${{ steps.locate.outputs.project_dir }}/gradlew"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          test -f "$APK"
          echo "Built: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
